<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#12304a"><meta name="description" content="Calculadora de metragem de cordão para pedidos do setor têxtil"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg" type="image/svg+xml"><title>Calculadora de Cordão</title><style>:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#152d40;background:#eef3f7}*{box-sizing:border-box}body{margin:0}.top{background:#12304a;color:white;padding:28px 20px 24px;text-align:center}.top h1{font-size:1.45rem;margin:0 0 7px}.top p{margin:0;opacity:.8;font-size:.92rem}main{max-width:480px;margin:22px auto;padding:0 16px}.card{background:white;border-radius:18px;padding:22px;box-shadow:0 8px 30px #12304a14}label{display:block;font-weight:650;margin:0 0 8px}.field{margin-bottom:20px}input,select{font:inherit;border:1.5px solid #cbd5df;border-radius:11px;padding:14px;width:100%;background:#fff;color:#152d40;font-size:1.12rem}input:focus,select:focus{outline:3px solid #c4e6ff;border-color:#1674b5}.row{display:grid;grid-template-columns:1fr 135px;gap:10px}.hint{font-size:.8rem;color:#647687;margin:6px 0 0}button{border:0;border-radius:11px;padding:15px;font:inherit;font-weight:700;cursor:pointer;width:100%}.primary{background:#0878b9;color:white}.secondary{background:#e9f1f7;color:#164c70;margin-top:10px}.result{background:#eaf7ef;border:1px solid #b6dfc5;border-radius:14px;padding:19px;margin-top:22px;text-align:center}.result small{display:block;color:#3d6350;font-weight:650}.result strong{display:block;font-size:2rem;color:#14693b;margin:7px 0}.detail{display:flex;justify-content:space-between;gap:8px;font-size:.92rem;border-top:1px solid #cce7d5;padding-top:12px;margin-top:12px}.error{color:#b42318;font-size:.9rem;min-height:20px;margin:10px 0 0}.footer{text-align:center;color:#738394;font-size:.76rem;margin:20px 0 30px}#install{display:none;margin-bottom:12px;background:#d7eafa;color:#164c70}@media(display-mode:standalone){#install{display:none!important}}</style></head><body><header class="top"><h1>Calculadora de Cordão</h1><p>Setor Têxtil • Metragem para pedido</p></header><main><button id="install" type="button">Instalar no celular</button><section class="card"><div class="field"><label for="length">Comprimento de cada cordão</label><div class="row"><input id="length" inputmode="decimal" placeholder="Ex.: 350" autocomplete="off"><select id="unit" aria-label="Unidade"><option value="mm">mm</option><option value="cm">cm</option><option value="m">metros</option></select></div></div><div class="field"><label for="qty">Quantidade de peças</label><input id="qty" inputmode="numeric" placeholder="Ex.: 5000" autocomplete="off"></div><div class="field"><label for="loss">Margem de perda (%)</label><input id="loss" inputmode="decimal" value="0" autocomplete="off"><p class="hint">Opcional. Deixe 0 para calcular sem acréscimo.</p></div><button class="primary" id="calculate">CALCULAR METRAGEM</button><p class="error" id="error" role="alert"></p><div class="result" id="result" hidden aria-live="polite"><small>TOTAL PARA PEDIDO</small><strong id="total"></strong><div class="detail"><span>Metragem sem perdas</span><b id="base"></b></div><div class="detail"><span>Acréscimo de perdas</span><b id="extra"></b></div></div><button class="secondary" id="copy" hidden>Copiar pedido / compartilhar</button><button class="secondary" id="clear">Limpar campos</button></section><p class="footer">Funciona sem internet após a primeira instalação.</p></main><script>const $=id=>document.getElementById(id);let deferredPrompt;const fmt=new Intl.NumberFormat('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});const parse=s=>{s=String(s).trim().replace(/\s/g,'');if(!s)return NaN;if(s.includes(',')&&s.includes('.'))s=s.replace(/\./g,'').replace(',','.');else if(s.includes(','))s=s.replace(',','.');else if(/^\d{1,3}(\.\d{3})+$/.test(s))s=s.replace(/\./g,'');return Number(s)};function calculate(){const length=parse($('length').value),qty=parse($('qty').value),loss=parse($('loss').value);$('error').textContent='';if(!Number.isFinite(length)||length<=0||!Number.isSafeInteger(qty)||qty<=0||!Number.isFinite(loss)||loss<0||loss>100){$('error').textContent='Informe comprimento e quantidade positivos e uma perda entre 0% e 100%.';$('result').hidden=true;$('copy').hidden=true;return}const factor={mm:1000,cm:100,m:1}[$('unit').value],base=length*qty/factor,extra=base*loss/100,total=base+extra;if(!Number.isFinite(total)){$('error').textContent='Valores muito grandes para calcular.';return}$('base').textContent=fmt.format(base)+' m';$('extra').textContent=fmt.format(extra)+' m';$('total').textContent=fmt.format(total)+' m';$('result').hidden=false;$('copy').hidden=false;window.orderText=`PEDIDO DE CORDÃO\nComprimento: ${$('length').value} ${$('unit').value}\nQuantidade: ${qty.toLocaleString('pt-BR')} peças\nMargem de perda: ${fmt.format(loss)}%\nMetragem sem perdas: ${fmt.format(base)} m\nTOTAL PARA PEDIDO: ${fmt.format(total)} m`}$('calculate').onclick=calculate;['length','qty','loss','unit'].forEach(id=>$(id).addEventListener('input',()=>{$('result').hidden=true;$('copy').hidden=true;$('error').textContent=''}));$('clear').onclick=()=>{$('length').value='';$('qty').value='';$('loss').value='0';$('unit').value='mm';$('result').hidden=true;$('copy').hidden=true;$('error').textContent='';$('length').focus()};$('copy').onclick=async()=>{try{if(navigator.share){await navigator.share({text:window.orderText});return}await navigator.clipboard.writeText(window.orderText);$('copy').textContent='Pedido copiado!';setTimeout(()=>$('copy').textContent='Copiar pedido / compartilhar',2000)}catch(e){if(e.name!=='AbortError')$('error').textContent='Não foi possível compartilhar. Tente novamente.'}};window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e;$('install').style.display='block'});$('install').onclick=async()=>{if(deferredPrompt){deferredPrompt.prompt();await deferredPrompt.userChoice;deferredPrompt=null;$('install').style.display='none'}};if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));</script></body></html>
